[logf-fn-details]
group=Definitions on this sheet win over outside groups of the same name. Three reads are errors: another sheet's group, which keeps sheets independent; a group that does not exist; and the definition itself, directly or through others.\n\nWhen an outside group changes, by hand or by a script, the sheet runs again within half a second. Signals at 0 in that group are left out.
constant=Repeated signals add up, and [font=logf-mono]{}[/font] is an empty group. In the editor a constant shows as slots, like a constant combinator.
network=Only items are counted, each at its own quality. A sheet that reads a network runs again every half second (30 ticks).\n\nPrefer a name, set in any of the network's roboports: it keeps working as the network grows, splits and merges, while a position stops working once no roboport covers it. A missing network is an error.
ingredients=Fluids are included, and a chest cannot request them: drop them with [img=virtual-signal/logf-fn-drop] drop, as in [font=logf-mono](drop (ingredients processing-unit 10) fluid/sulfuric-acid)[/font]. For a craft at a higher quality, follow with [img=virtual-signal/logf-fn-set-quality] set-quality.
products=A product with a chance or a range of amounts counts at its average: a 0.7% chance gives 0.007 per craft. Productivity is not included; for +50%, multiply the result by 1.5. Products that are neither items nor fluids are left out.
sum=With numbers, it computes a count anywhere one goes: [font=logf-mono](ingredients iron-gear-wheel (sum 10 20))[/font] is 30 crafts.
subtract=Signals found only in a subtracted group, or more plentiful there, come out negative. To request only what is short, follow with [img=virtual-signal/logf-fn-keep-positive] keep-positive.
multiply=Several factors multiply together: [font=logf-mono](multiply {iron-plate 10} 2 3)[/font] gives 60 iron plates.
divide=Counts stay fractional until the group is written: 2.5 is written as 3, while [font=logf-mono](multiply 4 (divide {iron-plate 10} 4))[/font] writes exactly 10.
highest=A signal missing from a group counts as 0 there, so [font=logf-mono](highest {iron-plate -5} {pipe 1})[/font] gives iron-plate 0 and pipe 1. To raise counts to a number, use [img=virtual-signal/logf-fn-at-least] at-least.
lowest=A signal missing from a group counts as 0 there, so the result holds what every group has: [font=logf-mono](lowest (group "wanted") (network "Main"))[/font] is what can be taken from the network. To cap counts at a number, use [img=virtual-signal/logf-fn-at-most] at-most.
at-least=Only signals already in the group change; none are added. A count raised above its limit raises the limit when written, as described in [img=virtual-signal/logf-doc-settings] Request settings.
at-most=To cap only some signals, cap them apart and add the rest back: [font=logf-mono](sum (at-most (keep (group "mall") pipe) 50) (drop (group "mall") pipe))[/font].
keep-positive=Fractions above zero are kept and written rounded up: 0.25 requests 1.
quality-up=Each signal stops at the best quality researched so far, and the sheet runs again when research changes it. Signals without a quality, such as fluids, stay as they are; signals that reach the same quality add up.
quality-down=To bring every signal to normal however many levels above it is, use [img=virtual-signal/logf-fn-set-quality] set-quality with normal.
set-quality=Unlike [img=virtual-signal/logf-fn-quality-up] quality-up, it sets locked qualities too. Signals that end up at the same quality add up, so [font=logf-mono](set-quality (network "Main") normal)[/font] counts each item over all its qualities. Signals without a quality stay as they are.
round-to-stacks=Only positive item counts change, and an exact multiple stays as it is. Each item rounds to its own stack size.
set-stacks=The previous count of an item does not matter, even when negative. Signals other than items keep their counts. To cap requests at a number of stacks: [font=logf-mono](set-max (group "mall") (set-stacks (group "mall") 4))[/font].
keep=Also accepts groups, to keep what another group holds: [font=logf-mono](keep (network "Main") (group "mall"))[/font] is the network's stock of the mall's items, at the mall's qualities.
drop=Also accepts groups, to drop what another group holds, each at its own quality.
set-max=How limits are written, and what they do in a player's logistics, is on [img=virtual-signal/logf-doc-settings] Request settings.
no-max=Use it to request a player's logistics list from a chest without the list's limits.
get-max=Turns limits back into counts, for example to request the room left below them: [font=logf-mono](keep-positive (subtract (get-max (group "mall")) (network "Main")))[/font].
import-from=Used by space platform hubs and cargo landing pads; other members ignore it. Any space location that is not hidden can be named.
request-from=Used by space platform hubs only.
min-delivery=Used by space platform requests only: a rocket waits until it can bring at least this many. A fraction is written rounded up.

