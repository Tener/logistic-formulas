[tips-and-tricks-item-name]
logf-overview=Logistic formulas
logf-restock=Keeping a mall stocked
logf-reference=Looking things up

[tips-and-tricks-item-description]
logf-overview=Logistic formulas computes logistic groups from formulas over constants, other groups, logistic networks and recipes. Chests, combinators, cargo landing pads and platform hubs use the results like any other group, and the results follow their sources.\n\nOpen the editor with __CONTROL__logf-formulas__, the shortcut bar or the button in the top left corner. Press [font=default-semibold]+ New group[/font], pick a function and fill in its arguments, or press [font=default-semibold]Edit as text[/font] and write the sheet out:\n__1__\nEach definition writes a group named after it, behind the sheet's prefix.
logf-restock=A formula can read a logistic network and request only what is missing:\n__1__\nThe first group is the target. The second subtracts what the storage chests of the network named Main hold, and [img=virtual-signal/logf-fn-keep-positive] keep-positive drops what is already there in full. The network is read again every half second, and the group changes as the shortfall does. Give it to a requester chest, or to a constant combinator that switches assemblers on.
logf-reference=In the editor, hover a function's name to see how it is written, its parameters and an example. The ? beside it opens its page in Factoriopedia, in the Logistic formulas tab, next to the guide pages:\n[img=virtual-signal/logf-doc-overview] Overview  [img=virtual-signal/logf-doc-language] Language  [img=virtual-signal/logf-doc-settings] Request settings  [img=virtual-signal/logf-doc-editor] Editor  [img=virtual-signal/logf-doc-strategy-mall] Malls  [img=virtual-signal/logf-doc-strategy-space] Space platforms

