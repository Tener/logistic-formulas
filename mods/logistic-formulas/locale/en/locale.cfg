[factoriopedia-description]
logf-doc-overview=Each formula computes one logistic group from constants, other groups, logistic network contents and recipes, and keeps it up to date as they change. Chests, combinators, cargo landing pads and space platform hubs use that group like one set by hand.\n\n[font=default-semibold]Sheets[/font]\nOpen the editor with __CONTROL__logf-formulas__, the shortcut bar or the button in the top left corner. Definitions live on sheets, one tab each, and each sheet has a prefix that goes in front of the groups it writes: with the prefix [virtual-signal=signal-F], [font=logf-mono](def "mall" ...)[/font] writes the group [virtual-signal=signal-F] mall. Formulas on the same sheet leave the prefix out: [font=logf-mono](group "mall")[/font].\nA sheet may read any group no formula computes, by its full name, but not another sheet's groups. No prefix may start another, so two sheets never write the same group.\n\n[font=default-semibold]When groups update[/font]\n• At once, when a formula changes.\n• Within half a second (30 ticks), when a group the sheet reads from outside changes.\n• Every half second, for a sheet that reads a logistic network.\n• When research finishes or is reversed, since it changes the qualities that quality-up may reach.\nA group is rewritten only when its contents change.\n\n[font=default-semibold]Owned groups[/font]\nA group a formula computes belongs to it: a change made through a chest or combinator is undone, with a warning. When a definition is removed or renamed, or the prefix changes, the old group is deleted if nothing uses it; otherwise it keeps its last contents and no longer updates.\n\n[font=default-semibold]Errors[/font]\nA definition with an error shows it in the editor, and its group keeps the contents it had. Definitions that read it fail too; the rest keep working.\n\n[font=default-semibold]A first sheet[/font]\n__1__\nThe second group follows the first: add an item to "mall" and "mall rare" gets it too.

logf-doc-language=[font=default-semibold]Definitions[/font]\nA sheet is a list of definitions [font=logf-mono](def "name" formula)[/font]. A formula is a number, a constant in braces such as [font=logf-mono]{iron-plate 100}[/font], or a function applied to arguments: [font=logf-mono](function argument ...)[/font]. Names that hold spaces or any of [font=logf-mono]( ) { } " ;[/font] need quotes; inside quotes, a backslash makes the next character plain. [font=logf-mono];[/font] starts a comment that runs to the end of the line.\n\n[font=default-semibold]Groups and numbers[/font]\nEvery formula gives either a group or a number. A group is a set of signals, each with a count and the four settings described in [img=virtual-signal/logf-doc-settings] Request settings. A definition must give a group. A number next to a group scales or clamps it, in [img=virtual-signal/logf-fn-multiply] multiply, [img=virtual-signal/logf-fn-divide] divide, [img=virtual-signal/logf-fn-at-least] at-least and [img=virtual-signal/logf-fn-at-most] at-most; other functions take all groups or all numbers. Each function's page says what it takes and gives; anything else is an error.\n\n[font=default-semibold]Signals[/font]\nA signal is written [font=logf-mono][type/]name[:quality][/font]: [font=logf-mono]iron-plate[/font], [font=logf-mono]fluid/water[/font], [font=logf-mono]virtual/signal-A[/font], [font=logf-mono]iron-plate:rare[/font]. Without a type, the name is looked up as an item, a fluid and a virtual signal, in that order; the types entity, recipe, space-location, asteroid-chunk and quality must be written. Only items, entities and recipes have a quality; any other signal is normal.\nTwo signals are the same when type, name and quality all match, so iron-plate and iron-plate:rare are counted apart. In [img=virtual-signal/logf-fn-keep] keep and [img=virtual-signal/logf-fn-drop] drop, a signal written without a quality matches every quality: [font=logf-mono](drop (group "mall") iron-plate)[/font] drops iron plates of all qualities, [font=logf-mono](drop (group "mall") iron-plate:normal)[/font] only normal ones.\n\n[font=default-semibold]Numbers[/font]\nNumbers may be fractions and negative, and take the units k, M and G: [font=logf-mono]2.5k[/font] is 2500. Wherever a number goes, a formula that gives a number may go instead: [font=logf-mono]{iron-plate (multiply 4 50)}[/font].\n\n[font=default-semibold]Rounding[/font]\nCounts are exact through every step and rounded only when a group is written, away from zero: 0.1 is written as 1, and -0.1 as -1. Signals with a count of 0 are left out. So [font=logf-mono](multiply 3 (divide {iron-plate 10} 3))[/font] writes 10.

logf-doc-settings=Besides its count, every signal in a group carries four settings, the same a logistic section's filter has:\n• [font=default-semibold]max[/font]: the upper limit. In a player's logistics, items above it are trashed. Set with [img=virtual-signal/logf-fn-set-max] set-max, removed with [img=virtual-signal/logf-fn-no-max] no-max, read back with [img=virtual-signal/logf-fn-get-max] get-max.\n• [font=default-semibold]import from[/font]: the planet or space location a platform hub or cargo landing pad gets the item from. Set with [img=virtual-signal/logf-fn-import-from] import-from.\n• [font=default-semibold]request from[/font]: whether a platform's request is filled from the planet, other platforms or both. Set with [img=virtual-signal/logf-fn-request-from] request-from.\n• [font=default-semibold]minimum delivery[/font]: the fewest a rocket brings at once. Set with [img=virtual-signal/logf-fn-min-delivery] min-delivery.\nConstants, networks and recipes give signals with none of them set; [img=virtual-signal/logf-fn-group] group copies them from the group it reads.\n\n[font=default-semibold]How they are written[/font]\nThe game rejects a limit below the count, so such a limit is written as the count. A signal with a negative count is written without a limit. Request from planet and a minimum delivery of 0 are the game's defaults and are not written.\n\n[font=default-semibold]When groups meet[/font]\nWhen several groups hold the same signal, its limit combines the way its count does:\n• [img=virtual-signal/logf-fn-sum] sum adds the limits; no limit in any group means none in the result;\n• [img=virtual-signal/logf-fn-highest] highest takes the higher limit; no limit beats any limit;\n• [img=virtual-signal/logf-fn-lowest] lowest takes the lower limit; any limit beats none.\nThe other three settings come from the first group that sets them. The quality functions combine signals that end up at the same quality as sum does; [img=virtual-signal/logf-fn-subtract] subtract keeps its first group's settings only.\n\n[font=default-semibold]Set limits last[/font]\nSince one signal without a limit makes a sum unlimited, adding a constant to a capped group drops the limits of the signals they share. Set the limits on the result instead:\n__1__\n\n[font=default-semibold]Example: a platform's order[/font]\n__2__\nRequests 400 of each, kept below 800, imported from Nauvis, with each rocket bringing at least 100.

logf-doc-editor=[font=default-semibold]Window[/font]\nOpen it with __CONTROL__logf-formulas__, the shortcut bar or the button in the top left corner. The title bar buttons make it smaller, larger or fill the screen, and pin it open beside other windows; its size and place are kept.\n\n[font=default-semibold]Sheets[/font]\nEach tab is a sheet; the + tab adds one. The bar above a sheet's definitions holds, from left to right:\n• Contents: shows what each group holds, beside its definition and, below them, for the groups no formula computes.\n• Collapse all and expand all.\n• Search: shows only the groups whose name contains the text (__CONTROL__focus-search__).\n• The prefix; click it to change it.\n• Edit as text: the whole sheet as text, for large edits and for sharing.\n• ?: opens this guide.\n• Delete the sheet; click twice.\n\n[font=default-semibold]Definitions[/font]\nEach definition shows its name, which a click renames, its signal count or its error, and buttons to duplicate, move and delete it. Under the tree, its formula as text; the pencil edits that text.\n\n[font=default-semibold]The tree[/font]\nEach row is one function. Hover its name for how it is written, its parameters and an example; the ? beside it opens its page here. Numbers, recipes and choices sit on the row; groups go on indented rows below, labelled with their parameter. A + row adds an optional or repeated argument. A constant shows its signals as slots: click one to edit it, right-click to remove it, and use the empty slot to add one.\nAt the end of each row: the number of signals that step gives (hover to see them, click to inspect the step, right-click to remove it), the wrap button, which puts the step inside a new function, and the button that unwraps or removes it.\n\n[font=default-semibold]Inspecting a step[/font]\nClicking a count shows that step's result above the tree, with actions on it: wrap, unwrap, move among its neighbours, cut, copy, paste over another step, and remove. Escape closes it.

logf-doc-strategy-mall=[font=default-semibold]One list, every quality[/font]\nKeep one list at normal quality and derive the others from it, so an item added to the list reaches every tier:\n__1__\n\n[font=default-semibold]Making what is missing[/font]\nSubtract what the network holds from the target, and keep only what is short. Put the group on a constant combinator to switch assemblers on, or on a requester chest for their materials:\n__2__\nWith providers, only provider chests count, which is where the mall puts its output. With all, belts that deconstruction left in storage chests would count as stock, and the mall would stop making them while its own chests are empty.\n\n[font=default-semibold]Feeding a line[/font]\nA recipe's ingredients, for a number of crafts and in whole stacks:\n__3__\n\n[font=default-semibold]Buffers and personal logistics[/font]\n__4__\nThe first fills a train with four times the mall in whole stacks. The second, in a player's logistics, requests the mall and trashes what goes above twice that.

logf-doc-strategy-space=[font=default-semibold]An order with limits and batches[/font]\n__1__\nThe hub requests the list, keeps no more than twice it, imports from Nauvis and waits until a rocket can bring at least 100.\n\n[font=default-semibold]Several planets[/font]\nGive each planet's part its location, then add them up; each signal keeps its own:\n__2__\n\n[font=default-semibold]From other platforms[/font]\n__3__\nThe request is filled by platforms in the same orbit instead of by rockets.\n\n[font=default-semibold]Feeding a silo[/font]\n__4__\nWhat 50 rocket parts take, for a requester chest beside a silo that fills platform requests from its network.

[logf-fn-summary]
group=Reads another group: its signals, counts and request settings.
constant=Lists signals with fixed counts.
network=Counts the items in a logistic network.
ingredients=Lists what a recipe consumes, for a number of crafts.
products=Lists what a recipe makes, for a number of crafts, at its average yield.
sum=Adds groups signal by signal, or adds numbers.
subtract=Subtracts the other groups from the first, signal by signal, or subtracts numbers.
multiply=Multiplies every count of a group by numbers, or multiplies numbers.
divide=Divides every count of a group by a number, or divides two numbers.
highest=Keeps the highest count of each signal across the groups, or the largest number.
lowest=Keeps the lowest count of each signal across the groups, or the smallest number.
at-least=Raises every count below a number to that number.
at-most=Lowers every count above a number to that number.
keep-positive=Drops the signals whose count is zero or less.
quality-up=Raises the quality of items, entities and recipes, up to the best unlocked quality.
quality-down=Lowers the quality of items, entities and recipes, down to normal.
set-quality=Gives every item, entity and recipe the same quality.
round-to-stacks=Rounds item counts up to whole stacks.
set-stacks=Sets every item to a number of full stacks.
keep=Keeps only the signals named.
drop=Drops the signals named.
set-max=Sets the upper limit (max) of each signal.
no-max=Removes the upper limit (max) of every signal.
get-max=Turns the upper limits into counts, for the signals that have one.
import-from=Sets the planet or space location the signals are imported from.
request-from=Sets where a space platform's requests are filled from.
min-delivery=Sets the fewest items a rocket brings at once.

